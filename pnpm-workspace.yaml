packages:
  - "."

# Dependency overrides (pnpm ignores npm-style `overrides` in package.json).
overrides:
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  proxy-addr: ">=2.0.8"
  source-map-js: ">=1.2.2"
  # Transitive advisories (pnpm audit). None of these packages are used directly:
  # mysql2 (better-auth optional driver), effect/valibot (@hookform/resolvers
  # optional peers), deepmerge-ts (@prisma/config).
  mysql2: ">=3.23.1"
  # Prisma and UploadThing depend on Effect 3 APIs removed in Effect 4.
  effect: ">=3.20.0 <4"
  valibot: ">=1.4.2"
  deepmerge-ts: ">=8.0.0"
  # nwsapi 2.2.25+ (jsdom's selector engine) recurses forever on `:modal` /
  # `:fullscreen` because matchesNative() calls jsdom's Element.matches, which is
  # nwsapi again. @floating-ui probes `:modal`, so any floating test hangs ~250s.
  # Re-checked 2.2.27 (2026-08-30) — still hangs. Keep pinned until upstream or jsdom fixes it.
  nwsapi: "2.2.24"

allowBuilds:
  "@parcel/watcher": true
  "@google/genai": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  "@tsparticles/engine": true
  esbuild: true
  "msgpackr-extract": true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
