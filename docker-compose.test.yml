services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
        "
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/portfolio_test?replicaSet=rs0
      BETTER_AUTH_SECRET: test-secret-key-for-docker
      BETTER_AUTH_URL: http://localhost:3000
      OWNER_USER_EMAIL: owner@test.local
      OWNER_USER_PASSWORD: TestPassword123!
