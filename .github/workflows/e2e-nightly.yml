name: E2E Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Preview
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:push && pnpm db:seed
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OWNER_USER_EMAIL: ${{ secrets.OWNER_USER_EMAIL }}
          OWNER_USER_PASSWORD: ${{ secrets.OWNER_USER_PASSWORD }}

      - run: pnpm test:e2e:full
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          OWNER_USER_EMAIL: ${{ secrets.OWNER_USER_EMAIL }}
          OWNER_USER_PASSWORD: ${{ secrets.OWNER_USER_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_CLIENT_REFRESH_TOKEN: ${{ secrets.SPOTIFY_CLIENT_REFRESH_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14
