name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      CV_PDF_GENERATOR_SECRET: ci-build-cv-pdf-generator-secret
      UPLOADTHING_TOKEN: ci-build-uploadthing-token
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm type
      - run: pnpm test
      - run: pnpm build
        if: github.ref == 'refs/heads/main'

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      OWNER_USER_EMAIL: ${{ secrets.OWNER_USER_EMAIL }}
      OWNER_USER_PASSWORD: ${{ secrets.OWNER_USER_PASSWORD }}
      CV_PDF_GENERATOR_SECRET: ${{ secrets.CV_PDF_GENERATOR_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Vercel Preview URL
        id: vercel
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const deadline = Date.now() + 8 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha,
              });
              for (const dep of deployments) {
                if (!dep.environment?.toLowerCase().includes("preview")) continue;
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: dep.id,
                  per_page: 5,
                });
                const ok = statuses.find(
                  (s) => s.state === "success" && s.environment_url,
                );
                if (ok) {
                  core.setOutput("url", ok.environment_url);
                  return;
                }
                if (statuses.some((s) => s.state === "failure" || s.state === "error")) {
                  core.setFailed(`Vercel Preview deployment failed (${dep.environment})`);
                  return;
                }
              }
              await new Promise((r) => setTimeout(r, 10000));
            }
            core.setFailed("Timed out waiting for Vercel Preview URL");

      - run: pnpm db:push && pnpm db:seed

      - name: Build production server
        if: steps.vercel.outputs.url == ''
        run: pnpm build

      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ steps.vercel.outputs.url || 'http://127.0.0.1:3000' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_PREBUILT: "1"
          E2E_FULL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
