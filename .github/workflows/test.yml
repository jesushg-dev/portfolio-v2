name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      CV_PDF_GENERATOR_SECRET: ci-build-cv-pdf-generator-secret
      UPLOADTHING_TOKEN: ci-build-uploadthing-token
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm type
      - run: pnpm test
      - run: pnpm build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      OWNER_USER_EMAIL: ${{ secrets.OWNER_USER_EMAIL }}
      OWNER_USER_PASSWORD: ${{ secrets.OWNER_USER_PASSWORD }}
      CV_PDF_GENERATOR_SECRET: ${{ secrets.CV_PDF_GENERATOR_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:push && pnpm db:seed

      - name: Build production server
        run: pnpm build

      - run: pnpm test:e2e
        env:
          E2E_PREBUILT: "1"
          E2E_FULL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
